openapi: 3.0.3
info:
  title: Barber Shop API
  version: 1.0.0
  description: API para el catálogo, gestión de barbería y ventas.
servers:
  - url: /api
tags:
  - name: Items
  - name: Customers
  - name: Employees
  - name: Appointments
  - name: Sales
  - name: Reports
  - name: AuditLogs
paths:
  /items:
    get:
      operationId: listItems
      tags: [Items]
      summary: Listar items con filtros y paginación
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Buscar por nombre o descripción
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [SERVICE, PRODUCT] }
          description: Filtrar por categoría
        - name: active
          in: query
          required: false
          schema: { type: boolean }
          description: Filtrar por estado activo/inactivo
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: Cantidad de items por página (máximo 100)
        - name: sortBy
          in: query
          required: false
          schema: { type: string, default: "id", enum: [id, name, category, createdAt] }
          description: Campo para ordenar
        - name: sortDirection
          in: query
          required: false
          schema: { type: string, default: "asc", enum: [asc, desc] }
          description: Dirección de ordenamiento
      responses:
        '200':
          description: Catálogo de ítems con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedItems' }
    post:
      operationId: createItem
      tags: [Items]
      summary: Crear un nuevo item
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ItemRequest' } }
      responses:
        '201':
          description: Ítem creado
          content:
            application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } }
        '400':
          $ref: '#/components/responses/BadRequest'
  /items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getItem
      tags: [Items]
      summary: Obtener un item por ID
      responses:
        '200': { description: Ítem, content: { application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateItem
      tags: [Items]
      summary: Actualizar un item
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ItemRequest' } } }
      responses:
        '200': { description: Ítem actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
  
  /customers:
    get:
      operationId: listCustomers
      tags: [Customers]
      summary: Listar clientes con paginación
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Buscar por nombre o teléfono
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de clientes con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedCustomers' }
    post:
      operationId: createCustomer
      tags: [Customers]
      summary: Crear un nuevo cliente
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CustomerRequest' } }
      responses:
        '201':
          description: Cliente creado
          content:
            application/json: { schema: { $ref: '#/components/schemas/Customer' } }
        '400':
          $ref: '#/components/responses/BadRequest'
  /customers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getCustomer
      tags: [Customers]
      summary: Obtener un cliente por ID
      responses:
        '200': { description: Cliente, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateCustomer
      tags: [Customers]
      summary: Actualizar un cliente
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerRequest' } } }
      responses:
        '200': { description: Cliente actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: deleteCustomer
      tags: [Customers]
      summary: Eliminar un cliente
      responses:
        '204': { description: Cliente eliminado }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /employees:
    get:
      operationId: listEmployees
      tags: [Employees]
      summary: Listar empleados con paginación
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Buscar por nombre
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [BARBER, RECEPTIONIST, MANAGER] }
          description: Filtrar por rol
        - name: active
          in: query
          required: false
          schema: { type: boolean }
          description: Filtrar por estado activo/inactivo
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de empleados con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedEmployees' }
    post:
      operationId: createEmployee
      tags: [Employees]
      summary: Crear un nuevo empleado
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EmployeeRequest' } }
      responses:
        '201':
          description: Empleado creado
          content:
            application/json: { schema: { $ref: '#/components/schemas/Employee' } }
        '400':
          $ref: '#/components/responses/BadRequest'
  /employees/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getEmployee
      tags: [Employees]
      summary: Obtener un empleado por ID
      responses:
        '200': { description: Empleado, content: { application/json: { schema: { $ref: '#/components/schemas/Employee' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateEmployee
      tags: [Employees]
      summary: Actualizar un empleado
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeRequest' } } }
      responses:
        '200': { description: Empleado actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Employee' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: deleteEmployee
      tags: [Employees]
      summary: Eliminar un empleado
      responses:
        '204': { description: Empleado eliminado }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /appointments:
    get:
      operationId: listAppointments
      tags: [Appointments]
      summary: Listar citas con paginación y filtros
      parameters:
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date }
          description: Filtrar desde fecha
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date }
          description: Filtrar hasta fecha
        - name: employeeId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Filtrar por empleado
        - name: customerId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Filtrar por cliente
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED] }
          description: Filtrar por estado
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de citas con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAppointments' }
    post:
      operationId: createAppointment
      tags: [Appointments]
      summary: Crear una nueva cita
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AppointmentRequest' } }
      responses:
        '201':
          description: Cita creada
          content:
            application/json: { schema: { $ref: '#/components/schemas/Appointment' } }
        '400':
          $ref: '#/components/responses/BadRequest'
  /appointments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getAppointment
      tags: [Appointments]
      summary: Obtener una cita por ID
      responses:
        '200': { description: Cita, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateAppointment
      tags: [Appointments]
      summary: Actualizar una cita
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentRequest' } } }
      responses:
        '200': { description: Cita actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: deleteAppointment
      tags: [Appointments]
      summary: Eliminar una cita
      responses:
        '204': { description: Cita eliminada }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /sales:
    get:
      operationId: listSales
      tags: [Sales]
      summary: Listar ventas con paginación
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de ventas con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSales' }
    post:
      operationId: createSale
      tags: [Sales]
      summary: Crear una nueva venta con items
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaleRequest' } } }
      responses:
        '201': { description: Venta creada, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /sales/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getSale
      tags: [Sales]
      summary: Obtener una venta por ID
      responses:
        '200': { description: Venta, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /reports/daily/{date}:
    parameters:
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    get:
      operationId: getDailyReport
      tags: [Reports]
      summary: Obtener reporte diario
      responses:
        '200':
          description: Reporte diario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /reports/daily/generate/{date}:
    parameters:
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    post:
      operationId: generateDailyReport
      tags: [Reports]
      summary: Generar reporte diario
      responses:
        '201':
          description: Reporte generado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
  
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [AuditLogs]
      summary: Obtener logs de auditoría con paginación
      parameters:
        - name: entityType
          in: query
          required: false
          schema: { type: string }
          description: Filtrar por tipo de entidad
        - name: action
          in: query
          required: false
          schema: { type: string, enum: [CREATE, UPDATE, DELETE] }
          description: Filtrar por acción
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de logs de auditoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAuditLogs' }

components:
  responses:
    NotFound:
      description: Recurso no encontrado
    BadRequest:
      description: Solicitud inválida
  schemas:
    Pagination:
      type: object
      required: [page, pageSize, total, totalPages, hasNextPage]
      properties:
        page:
          type: integer
          description: Número de página actual
        pageSize:
          type: integer
          description: Items por página
        total:
          type: integer
          description: Total de items
        totalPages:
          type: integer
          description: Total de páginas
        hasNextPage:
          type: boolean
          description: Si existe siguiente página
    
    # Items
    PaginatedItems:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ItemResponse' }
          description: Lista de items
        pagination:
          $ref: '#/components/schemas/Pagination'
    ItemResponse:
      allOf:
        - $ref: '#/components/schemas/ItemRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
    ItemRequest:
      type: object
      required: [name, category]
      properties:
        name: { type: string, maxLength: 100, minLength: 1 }
        description: { type: string, maxLength: 500 }
        category: { type: string, enum: [SERVICE, PRODUCT] }
        active: { type: boolean, default: true }
    
    # Customers
    PaginatedCustomers:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        pagination:
          $ref: '#/components/schemas/Pagination'
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
    CustomerRequest:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, maxLength: 100, minLength: 1 }
        phone: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 100, format: email }
        address: { type: string, maxLength: 255 }
    
    # Employees
    PaginatedEmployees:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        pagination:
          $ref: '#/components/schemas/Pagination'
    Employee:
      allOf:
        - $ref: '#/components/schemas/EmployeeRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
    EmployeeRequest:
      type: object
      required: [name, role]
      properties:
        name: { type: string, maxLength: 100, minLength: 1 }
        role: { type: string, enum: [BARBER, RECEPTIONIST, MANAGER] }
        phone: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 100, format: email }
        active: { type: boolean, default: true }
    
    # Appointments
    PaginatedAppointments:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Appointment' }
        pagination:
          $ref: '#/components/schemas/Pagination'
    Appointment:
      allOf:
        - $ref: '#/components/schemas/AppointmentRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
    AppointmentRequest:
      type: object
      required: [customerId, employeeId, scheduledAt]
      properties:
        customerId: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        scheduledAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 500 }
        status: { type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED], default: SCHEDULED }
    
    # Sales
    PaginatedSales:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Sale' }
        pagination:
          $ref: '#/components/schemas/Pagination'
    Sale:
      type: object
      required: [id, customerId, employeeId, paymentMethod, totalAmount, discount, soldAt]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        customerId: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        paymentMethod: { type: string, enum: [CASH, TRANSFER, CARD] }
        totalAmount: { type: number, format: double, readOnly: true }
        discount: { type: number, format: double, default: 0 }
        notes: { type: string, maxLength: 500 }
        items:
          type: array
          items: { $ref: '#/components/schemas/SaleItemDetail' }
        soldAt: { type: string, format: date-time, readOnly: true }
    SaleRequest:
      type: object
      required: [customerId, employeeId, paymentMethod, items]
      properties:
        customerId: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        paymentMethod: { type: string, enum: [CASH, TRANSFER, CARD] }
        discount: { type: number, format: double, default: 0 }
        notes: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SaleItemRequest' }
    SaleItemRequest:
      type: object
      required: [itemId, quantity, unitPrice]
      properties:
        itemId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, format: double, minimum: 0 }
    SaleItemDetail:
      allOf:
        - $ref: '#/components/schemas/SaleItemRequest'
        - type: object
          required: [id, saleId]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            saleId: { type: integer, format: int64, readOnly: true }
    
    # Reports
    DailyReport:
      type: object
      required: [id, reportDate, totalSales, totalTransactions]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        reportDate: { type: string, format: date }
        totalSales: { type: number, format: double }
        totalTransactions: { type: integer }
        cashSales: { type: number, format: double }
        cardSales: { type: number, format: double }
        transferSales: { type: number, format: double }
        servicesSales: { type: number, format: double }
        productsSales: { type: number, format: double }
        generatedAt: { type: string, format: date-time, readOnly: true }
    
    # Audit Logs
    PaginatedAuditLogs:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        pagination:
          $ref: '#/components/schemas/Pagination'
    AuditLog:
      type: object
      required: [id, entityType, entityId, action, timestamp]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        entityType: { type: string }
        entityId: { type: integer, format: int64 }
        action: { type: string, enum: [CREATE, UPDATE, DELETE] }
        oldValues: { type: object, additionalProperties: true }
        newValues: { type: object, additionalProperties: true }
        userName: { type: string }
        timestamp: { type: string, format: date-time }
