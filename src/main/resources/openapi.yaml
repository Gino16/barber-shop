openapi: 3.0.3
info:
  title: Barber Shop API
  version: 1.0.0
  description: API para el catálogo, gestión de barbería y ventas.
servers:
  - url: /api
tags:
  - name: Items
  - name: Customers
  - name: Employees
  - name: Appointments
  - name: Sales
  - name: Reports
  - name: AuditLogs
paths:
  /items:
    get:
      operationId: listItems
      tags: [Items]
      summary: Listar items con filtros y paginación
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, example: "Corte" }
          description: Buscar por nombre o descripción
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [SERVICE, PRODUCT], example: SERVICE }
          description: Filtrar por categoría
        - name: active
          in: query
          required: false
          schema: { type: boolean, example: true }
          description: Filtrar por estado activo/inactivo
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, example: 10 }
          description: Cantidad de items por página (máximo 100)
        - name: sortBy
          in: query
          required: false
          schema: { type: string, default: "id", enum: [id, name, category, createdAt], example: name }
          description: Campo para ordenar
        - name: sortDirection
          in: query
          required: false
          schema: { type: string, default: "asc", enum: [asc, desc], example: asc }
          description: Dirección de ordenamiento
      responses:
        '200':
          description: Catálogo de ítems con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedItemsResponse' }
    post:
      operationId: createItem
      tags: [Items]
      summary: Crear un nuevo item
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ItemRequest' } }
      responses:
        '201':
          description: Ítem creado
          content:
            application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } }
        '400':
          $ref: '#/components/responses/BadRequest'
  /items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, example: 1 } }
    get:
      operationId: getItem
      tags: [Items]
      summary: Obtener un item por ID
      responses:
        '200': { description: Ítem, content: { application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateItem
      tags: [Items]
      summary: Actualizar un item
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ItemRequest' } } }
      responses:
        '200': { description: Ítem actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
  
  /customers:
    get:
      operationId: listCustomers
      tags: [Customers]
      summary: Listar clientes con paginación
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, example: "Juan" }
          description: Buscar por nombre o teléfono
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, example: 10 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de clientes con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedCustomersResponse' }
    post:
      operationId: createCustomer
      tags: [Customers]
      summary: Crear un nuevo cliente
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CustomerRequest' } }
      responses:
        '201':
          description: Cliente creado
          content:
            application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } }
        '400':
          $ref: '#/components/responses/BadRequest'
  /customers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, example: 1 } }
    get:
      operationId: getCustomer
      tags: [Customers]
      summary: Obtener un cliente por ID
      responses:
        '200': { description: Cliente, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateCustomer
      tags: [Customers]
      summary: Actualizar un cliente
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerRequest' } } }
      responses:
        '200': { description: Cliente actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: deleteCustomer
      tags: [Customers]
      summary: Eliminar un cliente
      responses:
        '204': { description: Cliente eliminado }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /employees:
    get:
      operationId: listEmployees
      tags: [Employees]
      summary: Listar empleados con paginación
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, example: "Carlos" }
          description: Buscar por nombre
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [BARBER, STYLIST, RECEPTIONIST, MANAGER], example: BARBER }
          description: Filtrar por rol
        - name: active
          in: query
          required: false
          schema: { type: boolean, example: true }
          description: Filtrar por estado activo/inactivo
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, example: 10 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de empleados con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedEmployeesResponse' }
    post:
      operationId: createEmployee
      tags: [Employees]
      summary: Crear un nuevo empleado
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EmployeeRequest' } }
      responses:
        '201':
          description: Empleado creado
          content:
            application/json: { schema: { $ref: '#/components/schemas/EmployeeResponse' } }
        '400':
          $ref: '#/components/responses/BadRequest'
  /employees/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, example: 1 } }
    get:
      operationId: getEmployee
      tags: [Employees]
      summary: Obtener un empleado por ID
      responses:
        '200': { description: Empleado, content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateEmployee
      tags: [Employees]
      summary: Actualizar un empleado
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeRequest' } } }
      responses:
        '200': { description: Empleado actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: deleteEmployee
      tags: [Employees]
      summary: Eliminar un empleado
      responses:
        '204': { description: Empleado eliminado }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /appointments:
    get:
      operationId: listAppointments
      tags: [Appointments]
      summary: Listar citas con paginación y filtros
      parameters:
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date, example: "2026-07-23" }
          description: Filtrar desde fecha
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date, example: "2026-07-23" }
          description: Filtrar hasta fecha
        - name: employeeId
          in: query
          required: false
          schema: { type: integer, format: int64, example: 1 }
          description: Filtrar por empleado
        - name: customerId
          in: query
          required: false
          schema: { type: integer, format: int64, example: 1 }
          description: Filtrar por cliente
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [SCHEDULED, PENDING, IN_PROGRESS, COMPLETED, CANCELLED], example: SCHEDULED }
          description: Filtrar por estado
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, example: 10 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de citas con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAppointmentsResponse' }
    post:
      operationId: createAppointment
      tags: [Appointments]
      summary: Crear una nueva cita
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AppointmentRequest' } }
      responses:
        '201':
          description: Cita creada
          content:
            application/json: { schema: { $ref: '#/components/schemas/AppointmentResponse' } }
        '400':
          $ref: '#/components/responses/BadRequest'
  /appointments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, example: 1 } }
    get:
      operationId: getAppointment
      tags: [Appointments]
      summary: Obtener una cita por ID
      responses:
        '200': { description: Cita, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateAppointment
      tags: [Appointments]
      summary: Actualizar una cita
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentRequest' } } }
      responses:
        '200': { description: Cita actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: deleteAppointment
      tags: [Appointments]
      summary: Eliminar una cita
      responses:
        '204': { description: Cita eliminada }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /sales:
    get:
      operationId: listSales
      tags: [Sales]
      summary: Listar ventas con paginación
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, example: 10 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de ventas con paginación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSalesResponse' }
    post:
      operationId: createSale
      tags: [Sales]
      summary: Crear una nueva venta con items
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaleRequest' } } }
      responses:
        '201': { description: Venta creada, content: { application/json: { schema: { $ref: '#/components/schemas/SaleResponse' } } } }
        '400':
          description: Datos de venta inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                itemNotFound:
                  value: { status: 400, error: Bad Request, message: El ítem no existe }
                inactiveItem:
                  value: { status: 400, error: Bad Request, message: El ítem está inactivo }
                invalidQuantity:
                  value: { status: 400, error: Bad Request, message: La cantidad debe ser mayor que cero }
                invalidDiscount:
                  value: { status: 400, error: Bad Request, message: El descuento es inválido }
                inconsistentData:
                  value: { status: 400, error: Bad Request, message: Datos de venta inconsistentes }
  /sales/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, example: 1 } }
    get:
      operationId: getSale
      tags: [Sales]
      summary: Obtener una venta por ID
      responses:
        '200': { description: Venta, content: { application/json: { schema: { $ref: '#/components/schemas/SaleResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /reports/daily/{date}:
    parameters:
      - { name: date, in: path, required: true, schema: { type: string, format: date, example: "2026-07-23" } }
    get:
      operationId: getDailyReport
      tags: [Reports]
      summary: Obtener reporte diario
      responses:
        '200':
          description: Reporte diario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReportResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  
  /reports/daily/generate/{date}:
    parameters:
      - { name: date, in: path, required: true, schema: { type: string, format: date, example: "2026-07-23" } }
    post:
      operationId: generateDailyReport
      tags: [Reports]
      summary: Generar reporte diario
      responses:
        '201':
          description: Reporte generado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [AuditLogs]
      summary: Obtener logs de auditoría con paginación
      parameters:
        - name: entityType
          in: query
          required: false
          schema: { type: string, example: "ITEM" }
          description: Filtrar por tipo de entidad
        - name: action
          in: query
          required: false
          schema: { type: string, enum: [CREATE, UPDATE, DELETE], example: CREATE }
          description: Filtrar por acción
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
          description: Número de página (1-indexed)
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, example: 10 }
          description: Cantidad de items por página (máximo 100)
      responses:
        '200':
          description: Lista de logs de auditoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAuditLogsResponse' }

components:
  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          example:
            status: 404
            error: Not Found
            message: Recurso no encontrado
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          example:
            status: 400
            error: Bad Request
            message: Solicitud inválida
  schemas:
    ErrorResponse:
      type: object
      required: [status, error, message]
      properties:
        status: { type: integer, example: 400 }
        error: { type: string, example: Bad Request }
        message: { type: string, example: Solicitud inválida }
    PaginationResponse:
      type: object
      example:
        page: 1
        pageSize: 10
        total: 25
        totalPages: 3
        hasNextPage: true
      required: [page, pageSize, total, totalPages, hasNextPage]
      properties:
        page:
          type: integer
          description: Número de página actual
        pageSize:
          type: integer
          description: Items por página
        total:
          type: integer
          format: int64
          description: Total de items
        totalPages:
          type: integer
          description: Total de páginas
        hasNextPage:
          type: boolean
          description: Si existe siguiente página
    
    # Items
    PaginatedItemsResponse:
      type: object
      example:
        data:
          - id: 1
            name: Corte Colegial
            description: Corte tradicional de colegial, largo uniforme con capas ligeras
            category: SERVICE
            price: 50000
            active: true
            createdAt: "2026-07-23T22:36:14.241650Z"
        pagination:
          page: 1
          pageSize: 10
          total: 25
          totalPages: 3
          hasNextPage: true
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ItemResponse' }
          description: Lista de items
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
    ItemResponse:
      allOf:
        - $ref: '#/components/schemas/ItemRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
      example:
        id: 1
        name: Corte Colegial
        description: Corte tradicional de colegial, largo uniforme con capas ligeras
        category: SERVICE
        price: 50000
        active: true
        createdAt: "2026-07-23T22:36:14.241650Z"
    ItemRequest:
      type: object
      example:
        name: Corte Fade
        description: Degradado gradual de los lados al tope
        category: SERVICE
        price: 50000
        active: true
      required: [name, category, price]
      properties:
        name: { type: string, maxLength: 100, minLength: 1 }
        description: { type: string, maxLength: 500 }
        category: { type: string, enum: [SERVICE, PRODUCT] }
        price: { type: number, format: decimal, minimum: 0 }
        active: { type: boolean, default: true }
    
    # Customers
    PaginatedCustomersResponse:
      type: object
      example:
        data:
          - id: 1
            name: Juan Perez
            phone: "+57 300 123 4567"
            email: juan.perez@example.com
            address: Calle 10 #20-30
            createdAt: "2026-07-23T22:36:14.241650Z"
        pagination:
          page: 1
          pageSize: 10
          total: 1
          totalPages: 1
          hasNextPage: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CustomerResponse' }
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
    CustomerResponse:
      allOf:
        - $ref: '#/components/schemas/CustomerRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
      example:
        id: 1
        name: Juan Perez
        phone: "+57 300 123 4567"
        email: juan.perez@example.com
        address: Calle 10 #20-30
        createdAt: "2026-07-23T22:36:14.241650Z"
    CustomerRequest:
      type: object
      example:
        name: Juan Perez
        phone: "+57 300 123 4567"
        email: juan.perez@example.com
        address: Calle 10 #20-30
      required: [name, phone]
      properties:
        name: { type: string, maxLength: 100, minLength: 1 }
        phone: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 100, format: email }
        address: { type: string, maxLength: 255 }
    
    # Employees
    PaginatedEmployeesResponse:
      type: object
      example:
        data:
          - id: 1
            name: Carlos Rodriguez
            role: BARBER
            phone: "+57 301 234 5678"
            email: carlos.rodriguez@example.com
            active: true
            createdAt: "2026-07-23T22:36:14.241650Z"
        pagination:
          page: 1
          pageSize: 10
          total: 1
          totalPages: 1
          hasNextPage: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EmployeeResponse' }
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
    EmployeeResponse:
      allOf:
        - $ref: '#/components/schemas/EmployeeRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
      example:
        id: 1
        name: Carlos Rodriguez
        role: BARBER
        phone: "+57 301 234 5678"
        email: carlos.rodriguez@example.com
        active: true
        createdAt: "2026-07-23T22:36:14.241650Z"
    EmployeeRequest:
      type: object
      example:
        name: Carlos Rodriguez
        role: BARBER
        phone: "+57 301 234 5678"
        email: carlos.rodriguez@example.com
        active: true
      required: [name, role]
      properties:
        name: { type: string, maxLength: 100, minLength: 1 }
        role: { type: string, enum: [BARBER, STYLIST, RECEPTIONIST, MANAGER] }
        phone: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 100, format: email }
        active: { type: boolean, default: true }
    
    # Appointments
    PaginatedAppointmentsResponse:
      type: object
      example:
        data:
          - id: 1
            customerId: 1
            employeeId: 1
            scheduledAt: "2026-07-23T14:00:00Z"
            notes: Cliente prefiere corte fade
            status: SCHEDULED
            createdAt: "2026-07-23T22:36:14.241650Z"
        pagination:
          page: 1
          pageSize: 10
          total: 1
          totalPages: 1
          hasNextPage: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AppointmentResponse' }
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
    AppointmentResponse:
      allOf:
        - $ref: '#/components/schemas/AppointmentRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
      example:
        id: 1
        customerId: 1
        employeeId: 1
        scheduledAt: "2026-07-23T14:00:00Z"
        notes: Cliente prefiere corte fade
        status: SCHEDULED
        createdAt: "2026-07-23T22:36:14.241650Z"
    AppointmentRequest:
      type: object
      example:
        customerId: 1
        employeeId: 1
        scheduledAt: "2026-07-23T14:00:00Z"
        notes: Cliente prefiere corte fade
        status: SCHEDULED
      required: [customerId, employeeId, scheduledAt]
      properties:
        customerId: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        scheduledAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 500 }
        status: { type: string, enum: [SCHEDULED, PENDING, IN_PROGRESS, COMPLETED, CANCELLED], default: SCHEDULED }
    
    # Sales
    PaginatedSalesResponse:
      type: object
      example:
        data:
          - id: 1
            customerId: 1
            employeeId: 1
            paymentMethod: CASH
            totalAmount: 50000
            discount: 0
            notes: Venta de servicio
            items:
              - id: 1
                saleId: 1
                itemId: 1
                quantity: 1
                unitPrice: 50000
                subtotalAmount: 50000
