services:
  postgres:
    image: postgres:16-alpine
    container_name: barber-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barber_shop}
      POSTGRES_USER: ${POSTGRES_USER:-barber_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barber_shop_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/DDL.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
